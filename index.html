<style>
  :root {
    --bg: #ECEAE5;
    --surface: #F8F7F3;
    --ink: #1B1A18;
    --muted: #67635C;
    --faint: #8E8A82;
    --line: #D5D1C9;
    --accent: #A8372A;
    --shadow: 0 1px 2px rgba(27, 26, 24, .05), 0 14px 32px -18px rgba(27, 26, 24, .28);
    --serif: "Songti SC", "STSong", "Source Han Serif SC", "Noto Serif CJK SC", "Noto Serif SC", serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131312;
      --surface: #1B1B19;
      --ink: #ECE9E3;
      --muted: #A39E95;
      --faint: #77736C;
      --line: #2E2D2A;
      --accent: #DA6650;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 18px 36px -20px rgba(0, 0, 0, .8);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 32px; }

  /* 顶栏 */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 24px; font-size: 14px; color: var(--muted);
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-weight: 600; letter-spacing: .04em; }
  .seal {
    display: inline-grid; place-items: center;
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--accent); color: #fff;
    font-family: var(--serif); font-weight: 700; font-size: 17px; line-height: 1;
  }
  .gh { text-decoration: none; display: inline-flex; gap: 6px; align-items: center; padding: 6px 2px; }
  .gh:hover { color: var(--ink); }

  /* 标题区 */
  .masthead { padding-top: 72px; padding-bottom: 40px; }
  .wordmark {
    margin: 0;
    font-family: var(--serif);
    font-weight: 900;
    font-size: clamp(72px, 15vw, 184px);
    line-height: .92;
    letter-spacing: -.02em;
  }
  .wordmark .si {
    font-family: var(--sans);
    font-weight: 200;
    letter-spacing: -.04em;
    color: var(--faint);
    margin-left: .04em;
  }
  .lede {
    margin: 28px 0 0;
    max-width: 34em;
    font-size: clamp(17px, 2vw, 20px);
    color: var(--muted);
    text-wrap: pretty;
  }
  .stats {
    display: flex; flex-wrap: wrap; gap: 8px 36px;
    margin: 36px 0 0; padding: 18px 0 0;
    border-top: 1px solid var(--line);
  }
  .stats div { display: flex; align-items: baseline; gap: 8px; }
  .stats dt { order: 2; font-size: 14px; color: var(--muted); }
  .stats dd { order: 1; margin: 0; font-family: var(--serif); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* 分类筛选 */
  .filters {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-bottom: 1px solid transparent;
    transition: border-color .2s;
  }
  .filters.stuck { border-bottom-color: var(--line); }
  .filters .wrap { display: flex; gap: 8px; padding-top: 14px; padding-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
  .filters .wrap::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    font: inherit; font-size: 14px;
    padding: 7px 14px; min-height: 36px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent; color: var(--muted);
    cursor: pointer;
    transition: background-color .15s, color .15s, border-color .15s;
  }
  .chip:hover { color: var(--ink); border-color: var(--faint); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .chip .n { margin-left: 6px; font-variant-numeric: tabular-nums; opacity: .6; }
  .chip:focus-visible, .card:focus-visible, .gh:focus-visible, .brand:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 3px;
  }

  /* 分区 */
  main { padding-bottom: 40px; }
  .section { padding-top: 48px; }
  .section[hidden] { display: none; }
  .section-head {
    display: flex; align-items: baseline; gap: 14px;
    margin: 0 0 22px; padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .section-head .idx { font-family: var(--mono); font-size: 13px; color: var(--accent); }
  .section-head h2 { margin: 0; font-family: var(--serif); font-size: 26px; font-weight: 700; letter-spacing: .02em; }
  .section-head .count { margin-left: auto; font-size: 14px; color: var(--faint); font-variant-numeric: tabular-nums; }

  /* 卡片 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
    gap: 28px 24px;
  }
  .card {
    display: flex; flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    text-decoration: none;
    transition: transform .25s cubic-bezier(.2, .7, .2, 1), box-shadow .25s, border-color .25s;
  }
  .card[hidden] { display: none; }
  .shot {
    position: relative;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: var(--line);
    border-bottom: 1px solid var(--line);
  }
  .shot img {
    display: block; width: 100%; height: 100%;
    object-fit: cover; object-position: top center;
    transition: transform .5s cubic-bezier(.2, .7, .2, 1);
  }
  .shot--contain img { object-fit: contain; background: #101113; }
  .cover {
    display: flex; flex-direction: column; justify-content: center;
    height: 100%; padding: 28px; color: #E9EEE5; background: #233B32;
  }
  .cover strong { font-family: var(--mono); font-size: clamp(22px, 3vw, 34px); letter-spacing: -.05em; }
  .cover span { margin-top: 16px; font-size: 13px; line-height: 1.8; }
  .body { display: flex; flex-direction: column; flex: 1; padding: 18px 20px 18px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 22px; font-size: 12px; color: var(--faint); letter-spacing: .06em; }
  .badge {
    padding: 1px 8px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    color: var(--accent); letter-spacing: .02em;
  }
  .card h3 {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
    margin: 8px 0 0;
    font-family: var(--serif); font-size: 23px; font-weight: 700; line-height: 1.3;
  }
  .card h3 .en { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--faint); letter-spacing: .02em; }
  .card p { margin: 8px 0 0; font-size: 15px; line-height: 1.7; color: var(--muted); text-wrap: pretty; }
  .foot {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: auto; padding-top: 16px;
    font-family: var(--mono); font-size: 12px; color: var(--faint);
  }
  .foot .domain { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .foot .go {
    flex: none; display: grid; place-items: center;
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--line); color: var(--ink);
    font-family: var(--sans); font-size: 15px;
    transition: background-color .2s, border-color .2s, color .2s;
  }
  @media (hover: hover) {
    a.card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--faint); }
    a.card:hover .shot img { transform: scale(1.035); }
    a.card:hover .go { background: var(--accent); border-color: var(--accent); color: #fff; }
  }

  footer { padding: 40px 0 56px; color: var(--faint); font-size: 13px; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 20px; }
  footer a { text-decoration: none; }
  footer a:hover { color: var(--ink); }

  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    .masthead { padding-top: 48px; padding-bottom: 28px; }
    .stats { gap: 6px 24px; }
    .stats dd { font-size: 24px; }
    .section { padding-top: 36px; }
    .section-head h2 { font-size: 22px; }
    .grid { gap: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>

<script>
(function () {
  var projects = window.PROJECTS || [];
  var cats = window.CATEGORIES || {};
  var catKeys = Object.keys(cats);

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function host(url) {
    try { var u = new URL(url); return (u.host + u.pathname).replace(/\/$/, ""); }
    catch (e) { return url; }
  }

  // 卡片
  function card(p) {
    var a = el(p.url ? "a" : "article", "card");
    if (p.url) {
      a.href = p.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.setAttribute("aria-label", p.title + (p.en ? " " + p.en : "") + "，在新窗口打开");
    }

    var shot = el("div", "shot" + (p.shotFit === "contain" ? " shot--contain" : ""));
    if (p.shot) {
      var img = new Image(960, 600);
      img.src = p.shot;
      img.alt = "";
      img.loading = "lazy";
      img.decoding = "async";
      shot.appendChild(img);
    } else if (p.cover) {
      var cover = el("div", "cover");
      cover.appendChild(el("strong", null, p.cover));
      cover.appendChild(el("span", null, p.coverNote));
      shot.appendChild(cover);
    }
    a.appendChild(shot);

    var body = el("div", "body");
    var meta = el("div", "meta");
    meta.appendChild(el("span", null, cats[p.cat] || ""));
    if (p.lock) meta.appendChild(el("span", "badge", p.lock));
    if (p.status) meta.appendChild(el("span", "badge", p.status));
    body.appendChild(meta);

    var h = el("h3", null, p.title);
    if (p.en) h.appendChild(el("span", "en", p.en));
    body.appendChild(h);
    body.appendChild(el("p", null, p.desc));

    var foot = el("div", "foot");
    foot.appendChild(el("span", "domain", p.url ? host(p.url) : "本地运行 · 暂无公开入口"));
    if (p.url) {
      var go = el("span", "go", "↗");
      go.setAttribute("aria-hidden", "true");
      foot.appendChild(go);
    }
    body.appendChild(foot);

    a.appendChild(body);
    var frame = el("div", "card-frame");
    frame.appendChild(a);
    if (p.shot) {
      var preview = el("button", "zoom", "放大 ↗");
      preview.setAttribute("aria-label", "预览 " + p.title);
      preview.onclick = function () { window.showProject(p); };
      frame.appendChild(preview);
    }
    return frame;
  }

  var main = document.getElementById("sections");
  var sections = {};
  catKeys.forEach(function (k, i) {
    var list = projects.filter(function (p) { return p.cat === k; });
    if (!list.length) return;
    var sec = el("section", "section");
    sec.id = k;
    var head = el("div", "section-head");
    head.appendChild(el("span", "idx", String(i + 1).padStart(2, "0")));
    head.appendChild(el("h2", null, cats[k]));
    head.appendChild(el("span", "count", list.length + " 个"));
    sec.appendChild(head);
    var grid = el("div", "grid");
    var items = list.map(function (p) {
      var node = card(p);
      grid.appendChild(node);
      return { project: p, node: node };
    });
    sec.appendChild(grid);
    main.appendChild(sec);
    sections[k] = { node: sec, count: head.querySelector(".count"), items: items };
  });

  // 筛选
  var chips = document.getElementById("chips");
  var buttons = {};
  function chip(key, label, n) {
    var b = el("button", "chip", label);
    b.type = "button";
    b.appendChild(el("span", "n", String(n)));
    b.addEventListener("click", function () { select(key, true); });
    chips.appendChild(b);
    buttons[key] = b;
  }
  chip("all", "全部", projects.length);
  var recentCount = projects.filter(function (p) { return p.recent; }).length;
  if (recentCount) chip("recent", "最近新增", recentCount);
  catKeys.forEach(function (k) {
    if (sections[k]) chip(k, cats[k], projects.filter(function (p) { return p.cat === k; }).length);
  });

  function select(key, fromClick) {
    var before = new Map();
    if (fromClick && !matchMedia("(prefers-reduced-motion: reduce)").matches)
      document.querySelectorAll(".card-frame").forEach(n => { if(n.offsetWidth) before.set(n,n.getBoundingClientRect()); });
    if (!buttons[key]) key = "all";
    Object.keys(buttons).forEach(function (k) { buttons[k].setAttribute("aria-pressed", String(k === key)); });
    Object.keys(sections).forEach(function (k) {
      var section = sections[k];
      var shown = 0;
      section.items.forEach(function (item) {
        var visible = key !== "recent" || item.project.recent;
        item.node.hidden = !visible;
        if (visible) shown++;
      });
      section.count.textContent = shown + " 个";
      section.node.hidden = !shown || (key !== "all" && key !== "recent" && k !== key);
    });
    if (before.size) document.querySelectorAll(".card-frame").forEach(n => {
      if (!n.offsetWidth) return;
      var rect = n.getBoundingClientRect(), old = before.get(n);
      n.animate([{opacity:old?1:0,transform:"translate("+(old?old.left-rect.left:0)+"px,"+(old?old.top-rect.top:12)+"px)"},{opacity:1,transform:"none"}],{duration:320,easing:"ease-out"});
    });
    if (fromClick) {
      history.replaceState(null, "", "#" + key);
      var bar = document.getElementById("filters");
      if (bar.getBoundingClientRect().top <= 0) bar.scrollIntoView();
    }
  }
  select(location.hash.slice(1));
  window.addEventListener("hashchange", function () {
    var key = location.hash.slice(1);
    if (buttons[key] || !key) {
      select(key || "all");
      document.dispatchEvent(new Event("gallery-filter"));

    }
  });

  // 吸顶时加分隔线
  var bar = document.getElementById("filters");
  var sentinel = el("div");
  bar.parentNode.insertBefore(sentinel, bar);
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (e) { bar.classList.toggle("stuck", !e[0].isIntersecting); }).observe(sentinel);
  }

  document.getElementById("year").textContent = new Date().getFullYear();
})();
</script>
